name: Backend (.NET)

on:
  push:
    paths: ["backend/**", "firebase/**", "operacao/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "firebase/**", "operacao/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

# Privilégio mínimo: os jobs só precisam de ler o repositório.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore
        run: dotnet restore FutebolAmador.sln

      - name: Build
        run: dotnet build FutebolAmador.sln --configuration Release --no-restore

      # Os testes de integração correm no ambiente "Testing": base de dados em memória, Firebase
      # simulado e autenticação de teste. Não precisam de segredos.
      - name: Testes
        run: >
          dotnet test Tests/Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testes
          path: backend/TestResults

  # Concorrência otimista (rowversion), restrições únicas e transações precisam de um SQL Server
  # real: a base de dados em memória não os simula. Cada teste cria e apaga a sua base de dados.
  testes-sql-server:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Testes-2026!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Testes-2026!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Testes com SQL Server
        env:
          # Palavra-passe só deste contentor efémero do CI (não é um segredo).
          FA_TESTES_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Testes-2026!;TrustServerCertificate=True"
        run: dotnet test Tests/Tests.csproj --configuration Release --filter "Category=SqlServer"

  # Exportação e eliminação das mensagens do chat (RGPD) contra o emulador do Firestore.
  testes-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: firebase-tools
        run: npm install -g firebase-tools@15
      - name: Build dos testes
        run: dotnet build Tests/Tests.csproj --configuration Release
      - name: Testes com o emulador
        working-directory: firebase
        run: >
          firebase emulators:exec --only firestore --project demo-futebol-amador
          "dotnet test ../backend/Tests/Tests.csproj --configuration Release --no-build --filter Category=Firestore"
      - name: Exportação e importação com o emulador
        run: ../operacao/firestore/testar-exportacao-emulador.sh
        working-directory: firebase

  docker:
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -f Api/Dockerfile -t futebol-amador-api .
