name: Demonstração web (GitHub Pages)

# Publica o frontend em modo demonstração (dados em memória, sem backend) em
# https://<utilizador>.github.io/futebol-amador/. Corre à mão (separador Actions) depois de o
# repositório ser público e de o GitHub Pages estar ativo com "Source: GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build da demonstração
        run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"

      # O GitHub Pages não conhece as rotas do Angular: o 404.html devolve a aplicação.
      - run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/frontend/browser

      - id: deploy
        uses: actions/deploy-pages@v4
