name: CI/CD - .NET 8 + SonarQube + DockerHub

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ developer, master ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'FutebolAmador.sln'
  SONAR_PROJECT_KEY: 'LDS-Backend'
  TEST_PROJECT: 'Tests/Tests.csproj' # 👈 muda este nome se o .csproj tiver outro nome
  TEST_RESULTS_DIR: 'TestResults'
  DOCKER_IMAGE_NAME: 'willkie/backend-lds' # 👈 altera aqui para o teu nome real no Docker Hub

jobs:
  # ======================================================
  # 1️⃣ BUILD
  # ======================================================
  build:
    name: 🔨 Build Solution
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

  # ======================================================
  # 2️⃣ UNIT TESTS (todas as branches)
  # ======================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT }} --configuration Release `
            --filter "FullyQualifiedName~Unit" `
            --logger "trx;LogFileName=unit-tests.trx" `
            --results-directory "${{ env.TEST_RESULTS_DIR }}"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Results
          path: ${{ env.TEST_RESULTS_DIR }}


  # ======================================================
  # 3️⃣ INTEGRATION TESTS + SONAR (só na master)
  # ======================================================
  integration-tests-and-sonar:
    name: 🔍 Integration Tests + SonarQube
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & .NET
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarQube Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Run Integration Tests + Sonar
        shell: pwsh
        run: |
          dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.verbose=true

          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-incremental

          dotnet test ${{ env.TEST_PROJECT }} --configuration Release `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --filter "FullyQualifiedName~Integration" `
            --results-directory "${{ env.TEST_RESULTS_DIR }}" `
            --logger "trx;LogFileName=integration-tests.trx"

          # Mover ficheiro de cobertura para raiz
          $coverage = Get-ChildItem -Recurse -Filter "coverage.opencover.xml" | Select-Object -First 1
          if ($coverage) {
            Copy-Item $coverage.FullName -Destination "coverage.opencover.xml" -Force
            Write-Host "✅ Cobertura copiada: $($coverage.FullName)"
          } else {
            Write-Host "⚠️ Nenhum ficheiro de cobertura encontrado!"
          }

          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ======================================================
  # 4️⃣ DEPLOY DOCKER HUB (só se master passar)
  # ======================================================
  dockerhub-deploy:
    name: 🐳 Push Docker Image
    runs-on: ubuntu-latest
    needs: integration-tests-and-sonar
    if: success() && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
