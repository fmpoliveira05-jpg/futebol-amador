name: CI - Build, Test & Analyze (.NET 9)

on:
  push:
    branches: [ master, main, developer ]
  pull_request:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'FutebolAmador.sln'

jobs:
  # ------------------ BUILD ------------------
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

  # ------------------ UNIT TESTS ------------------
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    needs: build
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        run: |
          dotnet test Tests/Unit --no-build --configuration Release `
            --logger "trx;LogFileName=unit-tests.trx" `
            --results-directory "TestResults"

  # ------------------ INTEGRATION TESTS + SONAR ------------------
  integration-tests-and-sonar:
    name: Integration Tests + SonarQube
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & .NET
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-dotnet-

      - name: Install SonarQube Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Run Integration Tests & Sonar
        shell: pwsh
        run: |
          dotnet-sonarscanner begin /k:"LDS-Backend" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

          dotnet test Tests/Integration --configuration Release `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --results-directory "TestResults"

          Get-ChildItem -Recurse TestResults | Format-Table -AutoSize

          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
