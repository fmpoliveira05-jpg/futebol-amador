name: CI/CD - .NET 8 + SonarQube + DockerHub

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ developer, master ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'FutebolAmador.sln'
  SONAR_PROJECT_KEY: 'LDS-Backend'
  TEST_PROJECT: 'Tests/Tests.csproj'
  TEST_RESULTS_DIR: 'TestResults'
  DOCKER_IMAGE_NAME: 'willkie/backend-lds'

jobs:

  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/


  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Run Unit Tests
        run: |
          dotnet test ${{ env.TEST_PROJECT }} --configuration Release \
            --filter "FullyQualifiedName~Unit" \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory "${{ env.TEST_RESULTS_DIR }}"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Results
          path: ${{ env.TEST_RESULTS_DIR }}


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [ build ]

    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Run Integration Tests with Coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT }} --configuration Release \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --filter "FullyQualifiedName~Integration" \
            --results-directory "${{ env.TEST_RESULTS_DIR }}" \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Integration-Test-Results
          path: ${{ env.TEST_RESULTS_DIR }}

  sonar-analysis:
    name: SonarQube Analysis
    runs-on: windows-latest
    needs: [ build, unit-tests, integration-tests ]
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java & .NET
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Sonar Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar Begin
        shell: pwsh
        run: |
          dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.verbose=true

      - name: Build for Sonar
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-incremental

      - name: Sonar End
        shell: pwsh
        run: |
          dotnet-sonarscanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"


  dockerhub-deploy:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: sonar-analysis
    if: success() && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[build]')

    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest -f ./Api/Dockerfile .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
