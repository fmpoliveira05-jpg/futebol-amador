name: Build, Test e Analyze (.NET 8)

on:
  push:
    branches: [ master, developer ]
  pull_request: {}

jobs:
  build-test-analyze:
    name: Build, Test e Analyze
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache dos pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build, Test and Analyze
        shell: powershell
        run: |
          # 1. INICIAR O SONAR (usar glob para os relatórios de coverage e junit)
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"LDS-Backend" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.cs.junit.reportsPaths="**/test-results.xml"

          # 2. RESTAURAR PACOTES
          dotnet restore FutebolAmador.sln

          # 3. BUILD em Release
          dotnet build FutebolAmador.sln --configuration Release --no-restore

          # 4. EXECUTAR TODOS OS TESTES DA SOLUTION e gerar coverage
          #    - executa por solution para correr todos os projectos de teste
          dotnet test FutebolAmador.sln --configuration Release `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --results-directory "TestResults" `
            --logger "trx;LogFileName=test-results.trx"

          # 4.1 Listar o que foi gerado para debug (muito importante para ver onde está o coverage)
          Write-Host "=== Conteúdo da pasta TestResults ==="
          Get-ChildItem -Path TestResults -Recurse | Format-Table -AutoSize

          # 5. FINALIZAR O SONAR (envia os relatórios)
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
