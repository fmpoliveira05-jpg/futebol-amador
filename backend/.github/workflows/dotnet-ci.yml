name: CI/CD - .NET 9 + SonarQube

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ developer, master ]

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'FutebolAmador.sln'
  TEST_RESULTS_DIR: 'TestResults'
  SONAR_PROJECT_KEY: 'LDS-Backend'

jobs:
  # ======================================================
  # 1️⃣ BUILD
  # ======================================================
  build:
    name: 🔨 Build Solution
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

  # ======================================================
  # 2️⃣ TESTES UNITÁRIOS (em todas as branches)
  # ======================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        run: |
          dotnet test Tests/Unit --no-build --configuration Release `
            --logger "trx;LogFileName=unit-tests.trx" `
            --results-directory "${{ env.TEST_RESULTS_DIR }}"

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Results
          path: ${{ env.TEST_RESULTS_DIR }}

  # ======================================================
  # 3️⃣ TESTES DE INTEGRAÇÃO + SONARQUBE (só na master)
  # ======================================================
  integration-tests-and-sonar:
    name: 🔍 Integration Tests + SonarQube
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & .NET
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-dotnet-

      - name: Install SonarQube Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Start SonarQube + Build + Test
        shell: pwsh
        run: |
          # 1️⃣ INICIAR ANÁLISE SONAR
          dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.cs.junit.reportsPaths="**/*.trx" `
            /d:sonar.verbose=true

          # 2️⃣ BUILD OBRIGATÓRIO PARA O SONAR
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-incremental

          # 3️⃣ EXECUTAR TESTES DE INTEGRAÇÃO COM COBERTURA
          dotnet test Tests/Integration --configuration Release `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --results-directory "${{ env.TEST_RESULTS_DIR }}" `
            --logger "trx;LogFileName=integration-tests.trx"

          # Mostrar o que foi gerado
          Write-Host "=== Conteúdo da pasta TestResults ==="
          Get-ChildItem -Path "${{ env.TEST_RESULTS_DIR }}" -Recurse | Format-Table -AutoSize

          # 4️⃣ FINALIZAR ANÁLISE SONAR
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Integration-Test-Results
          path: ${{ env.TEST_RESULTS_DIR }}
