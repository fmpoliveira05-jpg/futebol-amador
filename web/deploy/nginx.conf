# Servidor do frontend web em produção (nginx), com os cabeçalhos de segurança.
#
# Uso: copiar o conteúdo de dist/frontend/browser para /usr/share/nginx/html, este ficheiro para
# /etc/nginx/conf.d/default.conf e seguranca-cabecalhos.inc para /etc/nginx/conf.d/ (ou incluí-los
# no server{} do domínio, atrás do TLS).
#
# Sessão em cookies: a API grava cookies SameSite=Strict, que o browser só envia se a página e a API
# forem do mesmo site. Como duckdns.org é um sufixo público, app.duckdns.org e api.duckdns.org são
# sites diferentes: nesse caso sirva a API no mesmo domínio (bloco /api/ abaixo, com
# apiBaseUrl: '/api' no environment.ts) ou use um domínio próprio com subdomínios.
#
# A CSP permite só o próprio site, a API (connect-src), o Cloudflare Turnstile (script e moldura)
# e as imagens do Cloudinary e embebidas (data:). Se a API mudar de endereço, atualizar connect-src
# (e environment.ts). 'unsafe-inline' em style-src é preciso para os estilos dos componentes
# Angular; os scripts não têm nada em linha (inlineCritical está desligado no angular.json).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://amfootballapi.duckdns.org; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Source maps: a build de produção não os gera (sourceMap: false); se algum aparecer por engano,
    # não é servido (não expõe o código-fonte original).
    location ~* \.map$ {
        return 404;
    }

    # Ficheiros com hash no nome: cache longa (o add_header dentro do location substitui os de cima,
    # por isso os cabeçalhos de segurança repetem-se com o include).
    location ~* \.(?:js|css|woff2?|png|webp|ico|svg)$ {
        include /etc/nginx/conf.d/seguranca-cabecalhos.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Opcional: API no mesmo domínio (ver o comentário no topo). O backend confia no X-Forwarded-For
    # só se o IP deste nginx estiver em ForwardedHeaders:KnownProxies.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Rotas do Angular: devolve sempre o index.html, sem cache.
    location / {
        include /etc/nginx/conf.d/seguranca-cabecalhos.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
