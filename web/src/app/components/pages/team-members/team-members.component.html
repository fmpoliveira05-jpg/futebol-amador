<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Membros da equipa</h1>
    </div>

    <div class="page-header__actions">
      <label class="sr-only" for="pesquisa-membros">Procurar por nome ou posição</label>
      <input
        id="pesquisa-membros"
        type="search"
        class="search-input"
        placeholder="Procurar por nome ou posição"
        [value]="searchTerm()"
        (input)="onSearchTermChange($any($event.target).value)"
      />
    </div>
  </header>

  <div class="card">
    <div *ngIf="isLoading()" class="state state--loading">
      A carregar membros da equipa…
    </div>

    <div *ngIf="successMessage()" class="state state--ok" role="status">
      {{ successMessage() }}
    </div>

    <div *ngIf="errorMessage()" class="state state--error" role="alert">
      {{ errorMessage() }}
    </div>

    <div *ngIf="!isLoading()" class="tabela-scroll">
      <table class="members-table" *ngIf="filteredMembers().length; else noMembers">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Posição</th>
            <th>Administrador</th>
            <th class="members-table__actions-col"><span class="sr-only">Ações</span></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of filteredMembers()">
            <td><a [routerLink]="['/players/details', member.playerId]">{{ member.name }}</a></td>
            <td>{{ POSITION_MAP[member.position] || 'Sem posição' }}</td>
            <td>
              <span class="badge" [class.badge--admin]="member.isAdmin">
                {{ member.isAdmin ? 'Admin' : 'Jogador' }}
              </span>
            </td>
            <td class="members-table__actions">
              <button *ngIf="canPromote(member)" type="button" class="btn btn-secondary" [disabled]="ocupado() === member.playerId" (click)="promote(member)">
                Promover a admin
              </button>

              <button *ngIf="canDemote(member)" type="button" class="btn btn-secondary" [disabled]="ocupado() === member.playerId" (click)="demote(member)">
                Retirar admin
              </button>

              <button *ngIf="canRemove(member)" type="button" class="btn btn-danger" [disabled]="ocupado() === member.playerId" (click)="remove(member)">
                Expulsar
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <ng-template #noMembers>
        <div class="state">Não há membros para apresentar.</div>
      </ng-template>
    </div>
  </div>
</section>
