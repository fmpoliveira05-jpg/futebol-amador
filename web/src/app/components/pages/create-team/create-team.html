<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Criar equipa</h1>
      <p class="page-subtitle">Ficas como administrador: geres os membros, os convites de jogo e o calendário.</p>
    </div>
  </header>

  <div class="card">
    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }
    <app-equipa-form textoBotao="Criar equipa" [aGuardar]="aGuardar()" (guardar)="criar($event)" />
  </div>
</section>
