<div class="interior">
<header class="topo">
  <a routerLink="/" class="marca">
    <img src="assets/football.ico" alt="" class="marca__logo" width="32" height="32" />
    <span class="marca__nome">Futebol Amador</span>
  </a>
  <button
    type="button"
    class="topo__menu"
    (click)="aberto.set(!aberto())"
    [attr.aria-expanded]="aberto()"
    aria-controls="menu-principal"
  >
    <span class="sr-only">{{ aberto() ? 'Fechar menu' : 'Abrir menu' }}</span>
    <span aria-hidden="true">☰</span>
  </button>
</header>

<nav id="menu-principal" class="menu" [class.menu--aberto]="aberto()" aria-label="Menu principal">
  @for (grupo of grupos(); track $index) {
    <div class="menu__grupo">
      @if (grupo.titulo) {
        <p class="menu__titulo">{{ grupo.titulo }}</p>
      }
      @for (l of grupo.ligacoes; track l.rotulo) {
        <a
          class="menu__link"
          [routerLink]="l.rota"
          routerLinkActive="menu__link--ativo"
          [routerLinkActiveOptions]="{ exact: l.exato ?? false }"
          ariaCurrentWhenActive="page"
        >
          {{ l.rotulo }}
        </a>
      }
    </div>
  }
</nav>
</div>
