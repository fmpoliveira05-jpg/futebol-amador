<form class="card search-container" (ngSubmit)="search()" role="search" aria-label="Procurar equipas">
    <div class="search-form">
        <label>Nome da equipa
            <input type="text" name="NameTeam" [(ngModel)]="filters.NameTeam" />
        </label>
        <label>Divisão
            <input type="text" name="NameRank" [(ngModel)]="filters.NameRank" />
        </label>
        <label>Cidade
            <input type="text" name="City" [(ngModel)]="filters.City" />
        </label>
    </div>
    <div class="search-form">
        <label>Pontos (mín.)
            <input type="number" min="0" name="MinNumberPoints" [(ngModel)]="filters.MinNumberPoints" />
        </label>
        <label>Pontos (máx.)
            <input type="number" min="0" name="MaxNumberPoints" [(ngModel)]="filters.MaxNumberPoints" />
        </label>
        <label>Idade média (mín.)
            <input type="number" min="16" max="80" name="MinAge" [(ngModel)]="filters.MinAge" />
        </label>
        <label>Idade média (máx.)
            <input type="number" min="16" max="80" name="MaxAge" [(ngModel)]="filters.MaxAge" />
        </label>
        <label>Jogadores (mín.)
            <input type="number" min="1" name="MinNumberPlayers" [(ngModel)]="filters.MinNumberPlayers" />
        </label>
        <label>Jogadores (máx.)
            <input type="number" min="1" name="MaxNumberPlayers" [(ngModel)]="filters.MaxNumberPlayers" />
        </label>
    </div>
    <div class="search-actions">
        <button type="submit" class="btn btn-primary">Procurar</button>
        <button type="button" class="btn btn-link" (click)="limpar()">Limpar filtros</button>
    </div>
</form>
